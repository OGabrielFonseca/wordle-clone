@for (row of keys; track $index) {
  <div class="flex justify-center mb-2 space-x-2">
    @for (key of row; track $index) {
      <button
        class="p-2 md:p-6 lg:p-8 bg-teal-700 hover:bg-teal-600 rounded text-lg md:text-xl lg:text-2xl font-bold uppercase text-white"
        (click)="keyPressed(key)"
      >
        {{ key }}
      </button>
    }
  </div>
}
